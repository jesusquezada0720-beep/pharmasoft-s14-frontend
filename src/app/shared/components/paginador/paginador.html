<footer class="pagination" aria-label="Paginación">
  <span>Página {{ pagina() + 1 }} de {{ totalPaginas() || 1 }} · {{ totalElementos() }} registros</span>
  <label class="page-size">Filas
    <select [value]="tamanio()" (change)="cambiarTamanio($any($event.target).value)" aria-label="Filas por página">
      @for (opcion of tamaniosDisponibles; track opcion) {
        <option [value]="opcion">{{ opcion }}</option>
      }
    </select>
  </label>
  <div class="page-actions">
    <button type="button" [disabled]="pagina() <= 0" (click)="paginaCambiada.emit(pagina() - 1)">← Anterior</button>
    <button type="button" [disabled]="pagina() + 1 >= totalPaginas()" (click)="paginaCambiada.emit(pagina() + 1)">Siguiente →</button>
  </div>
</footer>
